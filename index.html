<style>
:root{
  color-scheme:dark;
  --bg:#111418;--surface:#1A1F26;--surface2:#232A33;--line:#2E3642;
  --text:#E9EDF2;--muted:#8D98A8;--accent:#4C8DFF;--accent-ink:#06142E;
  --gold:#E8B64A;--gold-ink:#1A1406;--danger:#FF6B5B;--ok:#4FC98A;--cash:#3DDC84;
  --shadow:0 18px 40px rgba(0,0,0,.45);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#EEF1F5;--surface:#FFFFFF;--surface2:#E4E9F0;--line:#D3DAE4;
    --text:#151A21;--muted:#5B6676;--accent:#1F63E0;--accent-ink:#FFFFFF;
    --gold:#B7861E;--gold-ink:#FFFFFF;--danger:#D23A2A;--ok:#1E8E57;--cash:#12894A;
    --shadow:0 18px 40px rgba(20,30,50,.18);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EEF1F5;--surface:#FFFFFF;--surface2:#E4E9F0;--line:#D3DAE4;
  --text:#151A21;--muted:#5B6676;--accent:#1F63E0;--accent-ink:#FFFFFF;
  --gold:#B7861E;--gold-ink:#FFFFFF;--danger:#D23A2A;--ok:#1E8E57;--cash:#12894A;
  --shadow:0 18px 40px rgba(20,30,50,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:env(safe-area-inset-top,0px) 120px;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
.userPill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;max-width:130px}
.avatar{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--body);font-weight:700;font-size:11.5px}
.userName{font-family:var(--body);font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewBar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;padding:8px 12px;border-radius:10px;border:1px dashed var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--surface));font-size:13px}
.viewBar span{flex:1;min-width:0;overflow-wrap:anywhere}
.viewBar .link{flex:none;white-space:nowrap}
@media (max-width:440px){.userPill .userName{display:none}.userPill{padding:3px}.prefs{gap:5px}}
.viewBar b{color:var(--gold)}
.userList{display:grid;gap:8px;margin-bottom:16px}
.userRow{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;color:var(--text)}
.userRow:hover{border-color:var(--muted)}
.userRow[aria-current="true"]{border-color:var(--accent)}
.userRow .avatar{width:32px;height:32px;font-size:14px}
.userRow .uTxt{display:grid;min-width:0}
.userRow .uTxt b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userRow .uTxt small{font-size:12px;color:var(--muted)}
.userRow .uN{margin-left:auto;flex:none;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.authView{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.authBox{width:100%;max-width:400px;display:grid;gap:14px}
.authBox .eyebrow{margin:0;font-size:11px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.authTitle{margin:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(44px,13vw,64px);line-height:.9;text-transform:uppercase}
.authBox .sub{margin:0;color:var(--muted)}
.authForm{display:grid;gap:10px}
.authForm .btn{flex:none;width:100%}
.hint2{margin:0;font-size:12px;color:var(--muted)}
.authPrefs{display:flex;justify-content:center}
.pinBox{display:grid;gap:10px}
.pinBox input{font-family:var(--mono);font-size:22px;letter-spacing:.3em;text-align:center;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.about p.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.skel{border-radius:12px;background:var(--surface);border:1px solid var(--line);aspect-ratio:3/4;max-width:100%}
@media (prefers-reduced-motion:no-preference){.skel{animation:shim 1.2s ease-in-out infinite alternate}@keyframes shim{from{opacity:.55}to{opacity:1}}}
.wrap{max-width:980px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.brand{display:grid;gap:2px;min-width:0}
.brand h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:36px;line-height:.95;margin:0;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.acc{color:var(--accent)}
.mode{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tag{margin:0;font-size:11px;color:var(--muted);line-height:1.3}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
#langBtn,#authLang{display:inline-flex;align-items:center;gap:5px;padding:4px 9px}
.flag{display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.paidHint{display:block;min-height:1em;margin-top:4px;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0}
.fxNote{margin:-10px 0 16px;font-size:11.5px;color:var(--muted)}
.fxNote:empty{display:none}
.warp{position:fixed;inset:0;z-index:60;display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--text)}
.warpLines{position:absolute;inset:-40% -60%;pointer-events:none;opacity:.55;
  background:repeating-linear-gradient(90deg,transparent 0 46px,color-mix(in srgb,var(--accent) 22%,transparent) 46px 47px,transparent 47px 120px)}
.warpIn{position:relative;display:grid;justify-items:center;gap:14px;padding:24px;text-align:center}
.warp .warpCar{display:none;width:clamp(170px,50vw,250px);height:auto;filter:drop-shadow(0 16px 18px rgba(0,0,0,.5))}
.warp[data-kind="car"] .warpCar{display:block}
.warp .warpHome{display:none;width:clamp(180px,52vw,270px);height:auto;filter:drop-shadow(0 16px 18px rgba(0,0,0,.5))}
.warp[data-kind="home"] .warpHome{display:block}
.warp .warpAbout,.warp .warpAdded{display:none;width:clamp(180px,52vw,270px);height:auto;filter:drop-shadow(0 16px 18px rgba(0,0,0,.5))}
.warp[data-kind="about"] .warpAbout,.warp[data-kind="added"] .warpAdded{display:block}
.warp[data-kind="about"] .warpBob,.warp[data-kind="added"] .warpBob{display:none}
.warp[data-kind="about"] .warpLines,.warp[data-kind="added"] .warpLines{opacity:.8}
.warp[data-kind="added"] .warpText{color:var(--ok)}
.warp[data-kind="home"] .warpBob{display:none}
.warp[data-kind="home"] .warpLines{opacity:.8}
.warp[data-kind="car"] .warpBob{display:none}
.warp[data-kind="car"] .warpLines{opacity:.8}
.warpBob{width:clamp(150px,44vw,210px);height:auto;filter:drop-shadow(0 14px 22px rgba(0,0,0,.45))}
.warpText{margin:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(24px,7.5vw,34px);line-height:1;text-transform:uppercase;max-width:14em;text-wrap:balance}
.warpFlag{width:120px;height:8px;border-radius:2px;background:repeating-conic-gradient(var(--text) 0 25%,var(--bg) 0 50%) 0 0/8px 8px}
.warp.fade{transition:opacity .25s ease}
.warp.fade.hide{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .warp.in{animation:warpIn .42s cubic-bezier(.7,0,.2,1) both}
  .warp.out{animation:warpOut .42s cubic-bezier(.7,0,.2,1) both}
  .warp .warpLines{animation:sp-rush .45s linear infinite}
  .warp.in .warpBob{animation:bobPop .55s cubic-bezier(.2,1.5,.4,1) .12s both, bobDance .5s ease-in-out .67s infinite alternate}
  .warp.in .warpText{animation:sp-in .5s cubic-bezier(.2,.8,.2,1) .2s both}
  .warp.out .warpBob{animation:bobExit .42s cubic-bezier(.7,0,.2,1) both}
  .warp.in[data-kind="car"] .warpCar{animation:carIn .75s cubic-bezier(.2,.9,.3,1.1) .05s both, carIdle .2s linear .8s infinite alternate}
  .warp.out[data-kind="car"] .warpCar{animation:carOut .45s cubic-bezier(.6,0,.9,.4) both}
  .warp.in[data-kind="home"] .warpHome{animation:homeIn .8s cubic-bezier(.2,.9,.3,1.1) .05s both, carIdle .18s linear .85s infinite alternate}
  .warp.out[data-kind="home"] .warpHome{animation:homeOut .45s cubic-bezier(.6,0,.9,.4) both}
  .warp.in[data-kind="about"] .warpAbout{animation:aboutIn .8s cubic-bezier(.2,1.3,.4,1) .05s both, carIdle .22s linear .9s infinite alternate}
  .warp.out[data-kind="about"] .warpAbout{animation:aboutOut .42s cubic-bezier(.6,0,.9,.4) both}
  .warp.in[data-kind="added"] .warpAdded{animation:addedIn .7s cubic-bezier(.2,.9,.3,1.1) .05s both, addedHop .5s cubic-bezier(.3,0,.3,1) .8s 2 both, carIdle .18s linear 1.8s infinite alternate}
  .warp.out[data-kind="added"] .warpAdded{animation:carOut .45s cubic-bezier(.6,0,.9,.4) both}
  .warp.in[data-kind="money"] .warpMoney{animation:moneyIn .8s cubic-bezier(.2,.9,.3,1.1) .05s both, moneyFloat .6s ease-in-out .85s infinite alternate}
  .warp.out[data-kind="money"] .warpMoney{animation:moneyOut .45s cubic-bezier(.6,0,.9,.4) both}
  .warp.in[data-kind="snail"] .warpSnail{animation:snailIn .5s ease-out both}
  @keyframes snailIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
  @keyframes moneyIn{0%{transform:translate(-70vw,40vh) rotate(-18deg)}70%{transform:translate(2vw,-10px) rotate(4deg)}100%{transform:none}}
  @keyframes moneyFloat{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-14px) rotate(2deg)}}
  @keyframes moneyOut{to{transform:translate(80vw,-60vh) rotate(14deg)}}
  @keyframes aboutIn{0%{transform:translateY(-90vh) rotate(-8deg)}70%{transform:translateY(12px) rotate(2deg)}100%{transform:none}}
  @keyframes aboutOut{to{transform:translateY(100vh) rotate(6deg)}}
  @keyframes addedIn{0%{transform:translateX(-110vw) rotate(-4deg)}70%{transform:translateX(3vw) rotate(2deg)}100%{transform:none}}
  @keyframes addedHop{0%,100%{transform:none}40%{transform:translateY(-26px) rotate(-5deg)}}
  @keyframes homeIn{0%{transform:translateX(110vw) rotate(5deg)}65%{transform:translateX(-4vw) rotate(-3deg)}100%{transform:none}}
  @keyframes homeOut{to{transform:translateX(-120vw) skewX(12deg)}}
  @keyframes carIn{0%{transform:translateX(-110vw) rotate(-4deg)}70%{transform:translateX(3vw) rotate(2deg)}100%{transform:none}}
  @keyframes carIdle{from{transform:translateY(0) rotate(-.6deg)}to{transform:translateY(-3px) rotate(.6deg)}}
  @keyframes carOut{to{transform:translateX(120vw) skewX(-12deg)}}
  @keyframes warpIn{from{clip-path:polygon(0 0,0 0,-20% 100%,-20% 100%)}to{clip-path:polygon(0 0,120% 0,100% 100%,-20% 100%)}}
  @keyframes warpOut{from{clip-path:polygon(0 0,120% 0,100% 100%,-20% 100%)}to{clip-path:polygon(120% 0,120% 0,100% 100%,100% 100%)}}
  @keyframes bobPop{0%{opacity:0;transform:translateY(60px) scale(.5) rotate(-14deg)}100%{opacity:1;transform:none}}
  @keyframes bobDance{0%{transform:rotate(-7deg) translateY(0)}100%{transform:rotate(7deg) translateY(-8px)}}
  @keyframes bobExit{to{transform:translateX(70vw) rotate(25deg);opacity:0}}
  @keyframes sp-rush{to{transform:translateX(-120px)}}
  @keyframes sp-in{from{opacity:0;transform:translateX(-60px) skewX(-12deg)}to{opacity:1;transform:none}}
}
#about.sheet{inset:0;margin:auto;height:fit-content;max-height:calc(100% - 32px);width:min(420px,calc(100% - 32px));border-radius:18px;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#about .grab{display:none}
#about .cardWrap{margin-top:0}
.cardWrap{display:grid;justify-items:center;margin:4px 0 18px}
.hwCard{position:relative;width:min(100%,380px);aspect-ratio:662/1015;background-size:100% 100%;background-repeat:no-repeat;container-type:inline-size;color:#fff;filter:drop-shadow(0 18px 28px rgba(0,0,0,.45))}
.hwTop{position:absolute;left:5%;right:6%;top:37.5%;display:grid;gap:1cqw}

.catBtn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
.photo .photoBtns{flex-wrap:wrap;justify-content:flex-end;left:10px}

.pill{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;font-family:var(--mono);font-size:11.5px;padding:4px 10px;cursor:pointer;min-height:28px}

.pic img.ph{width:72%;height:auto;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.photo img.ph{width:40%;height:auto;max-width:40%;object-fit:contain;margin-bottom:28px}
.about .eyebrow{margin:0 0 2px;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.about h2{font-size:40px;line-height:.95}
.about .lead{margin:0 0 16px;font-size:16px;max-width:60ch}
.facts{display:grid;margin:0 0 16px;border-top:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:13px}
.facts dd{margin:0;font-weight:700}
.facts .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.legal{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.backup{display:grid;gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px;margin:0 0 14px}
.backup .sub{margin:0}
.backupRes{margin:0;font-size:14px}
.backupRes a{color:var(--accent);font-weight:700}
.car{position:relative}
.seriesWrap{position:relative;display:grid}
.sugg{display:grid;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.suggItem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 12px;text-align:left;cursor:pointer;font-size:15px}
.suggItem:last-child{border-bottom:0}
.suggItem:hover,.suggItem.on{background:var(--surface2)}
.suggItem small{flex:none;font-family:var(--mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.dup{border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--surface));border-radius:12px;padding:10px;display:grid;gap:8px}
.dup .dupHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.04em;text-transform:uppercase}
.dup .dupHead small{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
.dupItem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--bg);border-radius:9px;padding:6px;text-align:left;cursor:pointer}
.dupItem:hover{outline:1px solid var(--line)}
.dupItem .th{flex:none;width:56px;height:42px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;overflow:hidden}
.dupItem .th img{width:100%;height:100%;object-fit:cover}
.dupItem .th img.ph{width:82%;height:auto;object-fit:contain}
.dupItem b{display:block;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.dupItem span{font-size:12px;color:var(--muted)}
.dupItem .why{margin-left:auto;flex:none;font-family:var(--mono);font-size:10.5px;color:var(--gold)}
.more{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.more summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:16px;transition:transform .2s}
.more[open] summary::after{transform:rotate(45deg)}
.moreBody{display:grid;gap:10px;padding:0 12px 12px}
.moreBody .field input,.moreBody .field select,.moreBody .field textarea{background:var(--surface)}
@media (prefers-reduced-motion:no-preference){
  .grid.enter .car{animation:rise .34s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 30ms)}
  .car.pop{animation:pop .6s cubic-bezier(.2,.9,.25,1.15) both}
  .car.pop::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 2px var(--accent);animation:ring 1.4s ease-out forwards}
  .bump{display:inline-block;animation:bump .45s ease-out}
  .dup:not([hidden]){animation:rise .22s ease-out}
  .more[open] .moreBody{animation:rise .22s ease-out}
  .chip{transition:background-color .15s,color .15s,transform .1s}
  .chip:active,.fab:active,.btn:active{transform:scale(.96)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.82) translateY(8px)}60%{opacity:1;transform:scale(1.03)}100%{transform:none}}
  @keyframes ring{0%,40%{opacity:1}100%{opacity:0}}
  @keyframes bump{0%{transform:none}35%{transform:translateY(-3px) scale(1.12);color:var(--accent)}100%{transform:none}}
}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.buysTools{display:flex;gap:8px;margin-bottom:12px}
.buysTools input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.buysTools select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 8px;max-width:150px}
.buysList{display:grid;border-top:1px solid var(--line);margin-bottom:12px}
.buyRow{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;width:100%;padding:9px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);text-align:left;cursor:pointer}
.buyRow:hover{background:var(--surface2)}

.buyRow .th img{width:100%;height:100%;object-fit:cover}

.buyRow .bVal{display:grid;justify-items:end;font-family:var(--mono);font-variant-numeric:tabular-nums}
.buyRow .bVal b{font-size:14px;font-weight:600;color:var(--cash)}
.buyRow .bVal small{font-size:11px;color:var(--muted)}

.buysTotal{display:grid;gap:4px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin-bottom:12px}
.buysTotal div{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.buysTotal div b{font-family:var(--mono);color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.buysTotal .grand{font-size:15px;color:var(--text);font-weight:700;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.buysTotal .grand b{font-size:19px;color:var(--cash)}
.gStat.gClick{--tone:var(--cash);display:block;width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;position:relative;border-color:color-mix(in srgb,var(--tone) 45%,var(--line));background:color-mix(in srgb,var(--tone) 7%,var(--bg))}
.gStat.gClick.gBlue{--tone:var(--accent)}
.gStat.gClick:hover{border-color:var(--tone)}
.gStat.gClick b{color:var(--tone)}
.gStat.gClick small{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.gStat.gClick .gGo{font-size:11px;color:var(--tone);letter-spacing:.02em;text-transform:none;white-space:nowrap}
.gAvgTop{display:flex;align-items:center;gap:8px;min-width:0}
.gAvgTop b{flex:0 0 auto;overflow:visible}
.gSpark{display:block;flex:1 1 0;min-width:0;max-width:130px;height:22px;margin-left:auto}
.gSpark rect{fill:color-mix(in srgb,var(--muted) 55%,transparent)}
.gSpark rect.hi{fill:var(--cash)}
.gSpark line{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.gAvgLeg{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.gAvgLeg i{font-style:normal;color:var(--gold)}
.carsHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:-4px 0 14px}
.carsHead b{font-family:var(--mono);font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums}
.carsHead small{font-size:12px;color:var(--muted)}
.carsLetter{position:sticky;top:-2px;z-index:1;margin:0;padding:8px 2px 4px;font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;color:var(--accent);background:var(--surface);border-bottom:1px solid var(--line)}
.buyRow .qtyTag{font-family:var(--mono);font-size:12px;color:var(--muted);padding:2px 7px;border:1px solid var(--line);border-radius:999px}
.warp .warpSnail{display:none;width:clamp(200px,62vw,300px);height:auto;image-rendering:pixelated}
.warp[data-kind="snail"] .warpSnail{display:block}
.warp[data-kind="snail"] .warpBob{display:none}
.warp[data-kind="snail"] .warpText{color:#F29BB0}
.warp[data-kind="snail"] .warpLines{opacity:.35}
/* nomes de carrinhos sempre em maiúsculas, como na cartela */
.car .meta h3,.fCar,.dupItem b,.gTxt b,.buyRow .bTx b,#fName,#nameSugg .ntx,.catItem[data-model] b,#catTitle{text-transform:uppercase}
#fName::placeholder{text-transform:none}
.buysHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:-4px 0 14px}
.buysHead b{font-family:var(--mono);font-size:26px;color:var(--cash);font-variant-numeric:tabular-nums;white-space:nowrap}
.buysHead small{font-size:12px;color:var(--muted)}
.warp .warpMoney{display:none;width:clamp(170px,48vw,240px);height:auto;image-rendering:pixelated;filter:drop-shadow(0 16px 18px rgba(0,0,0,.5))}
.warp[data-kind="money"] .warpMoney{display:block}
.warp[data-kind="money"] .warpBob{display:none}
.warp[data-kind="money"] .warpText{color:var(--cash)}

button.stats{width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left;grid-template-columns:1fr 1fr;row-gap:6px;color:inherit}
button.stats .stat{display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.garageTile{position:relative;display:grid;align-content:start;justify-items:start;gap:8px;width:100%;padding:12px;border-radius:12px;cursor:pointer;text-align:left;color:var(--text);
  border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface) 70%)}

.gtGo{position:absolute;top:10px;right:12px;font-size:24px;line-height:1;color:var(--accent);font-weight:700}
.tiles.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:560px){.tiles.three{grid-template-columns:1fr 1fr}.tiles.three .friendsTile{grid-column:1/-1}}
.homeTile{
  border-color:color-mix(in srgb,var(--ok) 50%,var(--line));background:linear-gradient(100deg,color-mix(in srgb,var(--ok) 20%,var(--surface)),var(--surface) 70%)}
.homeTile:hover{border-color:var(--ok)}
.homeTile .gtIcon{background:var(--ok);color:#06140c}
.homeTile .gtGo{color:var(--ok)}
.friendsTile{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));background:linear-gradient(100deg,color-mix(in srgb,var(--gold) 16%,var(--surface)),var(--surface) 70%)}
.friendsTile:hover{border-color:var(--gold)}
.friendsTile .gtIcon{background:var(--gold);color:var(--gold-ink)}
.friendsTile .gtGo{color:var(--gold)}
.fList{display:grid;gap:8px;margin-bottom:18px}
.fCard{position:relative;display:flex;align-items:flex-start;gap:10px;width:100%;padding:12px 30px 12px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;cursor:pointer;color:var(--text)}
.fCard:hover{border-color:var(--muted)}
.fCard[aria-current="true"]{border-color:var(--accent)}

.garage h2{margin:0}

.bubble{position:absolute;top:2px;right:calc(100% - 4px);white-space:nowrap;background:var(--text);color:var(--bg);font-weight:700;font-size:12.5px;line-height:1;padding:7px 10px;border-radius:12px 12px 2px 12px}
.bubble::after{content:"";position:absolute;right:-5px;bottom:0;border:6px solid transparent;border-left-color:var(--text);border-bottom-color:var(--text);border-width:0 0 8px 8px}
@media (prefers-reduced-motion:no-preference){
  .mascot.play img{animation:mascotIn .7s cubic-bezier(.2,1.5,.4,1) both, mascotWobble 2.6s ease-in-out .8s infinite}
  .mascot.play .bubble{animation:bubbleIn .35s cubic-bezier(.2,1.4,.4,1) .55s both}
  @keyframes mascotIn{0%{opacity:0;transform:translateY(40px) rotate(-10deg) scale(.6)}100%{opacity:1;transform:rotate(7deg)}}
  @keyframes mascotWobble{0%,100%{transform:rotate(7deg)}50%{transform:rotate(2deg) translateY(-2px)}}

.b.ex{border-style:dashed;color:var(--muted)}
.qty{position:absolute;right:8px;bottom:8px;font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.meta{padding:10px 12px 12px;display:grid;gap:2px}
.meta h3{margin:0;font-size:15px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.meta p{margin:0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.meta .code{font-family:var(--mono);font-size:11px;color:var(--muted)}

.empty{text-align:center;color:var(--muted);padding:48px 12px}
.empty strong{display:block;color:var(--text);font-family:var(--display);font-style:italic;font-size:26px;text-transform:uppercase}

.fab{flex:none;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:13px 18px;cursor:pointer;font-size:15px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);max-width:640px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;text-transform:uppercase;margin:0 0 12px}
.photo{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;margin-bottom:12px;border:1px dashed var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}
.photoBtns{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.photo label{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text)}
.photo label.cam{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.photo .hint{position:absolute;left:10px;bottom:12px;font-size:12px;color:var(--muted)}
form{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.field input[type=color]{padding:4px;height:42px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:10px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);font-weight:700}
.actions{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;border-radius:10px;padding:12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;color:var(--danger);min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;font-weight:500}
@media (min-width:700px){.stats{max-width:560px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.bar .brand{flex:1;min-width:0}
.bar .brand h1{font-size:clamp(22px,6.8vw,36px);overflow:hidden;text-overflow:clip}
@media (max-width:420px){.bar .fab{padding:12px 15px;font-size:14px}}
.bar .tag{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>

<style>
  .splash{position:fixed;inset:0;z-index:100;background:#111418;color:#E9EDF2;display:grid;place-items:center;overflow:hidden;
    font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .45s ease,visibility .45s ease}
  .splash.out{opacity:0;visibility:hidden}
  .splash .sp-in{position:relative;display:grid;justify-items:center;gap:18px;padding:24px;text-align:center}
  .splash .sp-eyebrow{margin:0;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#8D98A8}
  .splash .sp-title{margin:0;font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-style:italic;font-weight:800;
    text-transform:uppercase;line-height:.86;font-size:clamp(52px,15vw,132px);letter-spacing:.01em}
  .splash .sp-title span{display:block}
  .splash .sp-title .sp-scale{color:#4C8DFF}
  .splash .sp-track{position:relative;width:min(240px,62vw);height:10px;border-radius:3px;overflow:hidden;background:#232A33}
  .splash .sp-fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(.08);
    background:repeating-conic-gradient(#E9EDF2 0 25%,#111418 0 50%) 0 0/10px 10px}
  .splash .sp-tag{margin:0;font-size:12.5px;color:#8D98A8}
  .splash .sp-lines{position:absolute;inset:-40% -60%;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(76,141,255,.18) 46px 47px,transparent 47px 120px);
    mask-image:radial-gradient(closest-side,#000,transparent);-webkit-mask-image:radial-gradient(closest-side,#000,transparent)}
  @media (prefers-reduced-motion:no-preference){
    .splash .sp-lines{animation:sp-rush .5s linear infinite}
    .splash .sp-title span{animation:sp-in .7s cubic-bezier(.2,.8,.2,1) both}
    .splash .sp-title .sp-scale{animation-delay:.14s}
    .splash .sp-eyebrow,.splash .sp-track,.splash .sp-tag{animation:sp-fade .5s ease .35s both}
    .splash .sp-fill{animation:sp-load 2.6s cubic-bezier(.3,.6,.2,1) .4s forwards}
    .splash.done .sp-fill{animation:none;transform:scaleX(1);transition:transform .35s ease}
    .splash.out .sp-in{transform:scale(1.06) translateX(14px);transition:transform .45s ease}
    @keyframes sp-rush{to{transform:translateX(-120px)}}
    @keyframes sp-in{from{opacity:0;transform:translateX(-60px) skewX(-12deg)}to{opacity:1;transform:none}}
    @keyframes sp-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes sp-load{to{transform:scaleX(.86)}}
  }
  .splash.done .sp-fill{transform:scaleX(1)}
</style>

        </div>

          <label class="field"><span data-i18n="fQty"></span><input id="fQty" type="number" inputmode="numeric" min="1" value="1"></label>

        </div>

  const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/['’`´]/g,"").replace(/[^a-z0-9]+/g," ").trim();
  const words = s => norm(s).split(" ").filter(w => w.length>1 || /\d/.test(w));
  function similar(name, code){
    const n = norm(name), nw = words(name), cd = norm(code).replace(/ /g,"");
    if (n.length < 3 && cd.length < 4) return [];
    const out = [];
    for (const c of cars) {
      if (editing && c.id===editing.id) continue;
      let why = null, score = 0;
      const cn = norm(c.name), cc = norm(c.code).replace(/ /g,"");
      if (cd.length>=4 && cc && cc===cd) { why="dupCode"; score=3; }
      else if (n.length>=3 && cn===n) { why="dupName"; score=2; }
      else if (n.length>=3 && cn) {
        const cw = words(c.name);
        const hit = nw.filter(w => cw.some(x => x===w || (w.length>=3 && x.startsWith(w)) || (x.length>=3 && w.startsWith(x)))).length;
        const ratio = hit / Math.max(1, Math.min(nw.length, cw.length));
        if (cn.includes(n) || n.includes(cn) || ratio>=0.6) { why="dupLike"; score=1+ratio/2; }
      }
      if (why) out.push({c, why, score});
    }
    return out.sort((a,b)=>b.score-a.score).slice(0,3);
  }

  function seriesOptions(q){
    const nq = norm(q);
    const counts = {};
    cars.forEach(c => { const k = (c.series||"").trim(); if (k) counts[k] = (counts[k]||0) + 1; });
    const mine = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
    const seen = new Set(), out = [];
    const add = (name, n) => { const k = norm(name); if (!k || seen.has(k)) return; seen.add(k); out.push({ name, n }); };
    const qw = nq.split(" ").filter(Boolean);
    const hit = name => { const n = norm(name); return !nq || n.includes(nq) || qw.every(w => n.includes(w)); };
    const starts = name => norm(name).startsWith(nq) || norm(name).replace(/^hw /,"").startsWith(nq);
    const wiki = seriesWiki || [];
    const yearsOf = name => { const w = wiki.find(x => norm(x.name) === norm(name)); return w ? w.years : null; };
    const addW = (x) => { const k = norm(x.name); if (!k || seen.has(k)) return; seen.add(k); out.push({ name: x.name, years: x.years }); };
    mine.filter(hit).forEach(n => { add(n, counts[n]); const y = yearsOf(n); if (y) out[out.length - 1].years = y; });
    if (nq) {
      wiki.filter(x => starts(x.name)).forEach(addW);
      SERIES.filter(starts).forEach(n => add(n));
      wiki.filter(x => hit(x.name)).forEach(addW);
      SERIES.filter(hit).forEach(n => add(n));
    } else {
      const recent = wiki.filter(x => x.years[0] >= new Date().getFullYear() - 1);
      (recent.length ? recent : []).forEach(addW);
      SERIES.forEach(n => add(n));
    }
    return out.filter(o => norm(o.name) !== nq || o.n).slice(0, 8);
  }

    if (v.num) $("fNum").value = v.num;
    if (v.code) $("fCode").value = v.code.toUpperCase();
    if (v.extra && !$("fNotes").value.trim()) $("fNotes").value = v.extra;
    if (/car culture|boulevard|premium|team transport|pop culture|fast & furious premium|replica entertainment|formula one/i.test(v.series)) $("fType").value = "Premium";
    else if (/red line club|rlc/i.test(v.series)) $("fType").value = "RLC";
    $("more").open = true;
    closeCat(); $("catHint").hidden = true; msg(""); toast(v.img ? "catChosen" : "catFilled"); checkDup();
  }
  function pickCat(url){
    pendingCat = url; pendingPhoto = null; showPhoto(url); closeCat(); $("catHint").hidden = true; msg(""); toast("catChosen");
  }
  const codeQuery = q => (String(q || "").trim().match(/^[A-Z]{2,4}\d{2,3}$/i) || [""])[0];
  $("catFilter").addEventListener("input", () => { clearTimeout(catFT); catFT = setTimeout(renderVersions, 120); });
  let catFT;
  $("catBtn").addEventListener("click", () => openCat());
  $("catForm").addEventListener("submit", e => { e.preventDefault(); runCatSearch(); });
  $("catBack").addEventListener("click", () => { $("catQ").value = catQuery; runCatSearch(); });
  $("catClose").addEventListener("click", closeCat);
  $("catScrim").addEventListener("click", closeCat);
  $("catGrid").addEventListener("click", e => {
    const b = e.target.closest(".catItem"); if (!b) return;
    if (b.dataset.model) showVersions(b.dataset.model, codeQuery(catQuery)); else if (b.dataset.v) pickVersion(catVersions[+b.dataset.v]); else if (b.dataset.img) pickCat(b.dataset.img);
  });
  /* sugestões de nome: lista de modelos da wiki guardada no aparelho, com apoio da busca online */
  const NAMES_KEY = "garagem164.names";
  const SKIP_NAME = /(^list of|series|\(disambiguation\)|^category|playset|track set|\bset\b|pack\b|collection$|^\d{4} |convention|treasure hunts?$|^hot wheels (id|unleashed|acceleracers|world race)$)/i;
  let names = null, namesBusy = null, seriesWiki = null;
  const MINI = /^(.*) Mini Collection \((\d{4})\)$/;
  function splitSeries(list){
    const map = {}, models = [];
    list.forEach(t => { const m = t.match(MINI); if (m) { (map[m[1]] = map[m[1]] || []).push(+m[2]); } else models.push(t); });
    seriesWiki = Object.keys(map).map(name => ({ name, years: map[name].sort((a, b) => b - a) })).sort((a, b) => b.years[0] - a.years[0] || a.name.localeCompare(b.name));
    return models;
  }
  const compact = x => norm(x).replace(/ /g, "");
  function prepNames(list){ return list.map(t => ({ t, n: norm(t), c: compact(t) })); }
  try { const c = JSON.parse(localStorage.getItem(NAMES_KEY) || "null"); if (c && c.list && c.v === 2 && Date.now() - c.at < 30 * 864e5) names = prepNames(splitSeries(c.list.split("\n"))); } catch (e) {}
  function loadNames(){
    if (names || namesBusy) return namesBusy;
    namesBusy = (async () => {
      const all = []; let cont = "";
      for (let i = 0; i < 40; i++) {
        const j = await wiki("&list=allpages&apnamespace=0&apfilterredir=nonredirects&aplimit=500" + (cont ? "&apcontinue=" + encodeURIComponent(cont) : ""));
        (j.query && j.query.allpages || []).forEach(p => { if (!SKIP_NAME.test(p.title)) all.push(p.title); });
        cont = j.continue && j.continue.apcontinue; if (!cont) break;
      }
      if (all.length > 500) {
        names = prepNames(splitSeries(all));
        try { localStorage.setItem(NAMES_KEY, JSON.stringify({ v: 2, at: Date.now(), list: all.join("\n") })); } catch (e) {}
        if (!$("seriesSugg").hidden) showSugg();
      }
    })().catch(() => {}).finally(() => { namesBusy = null; });
    return namesBusy;
  }
  const NAME_NOISE = new Set(["hot", "wheels", "hotwheels", "premium", "mainline", "the", "car", "carro", "carrinho", "de", "da", "do", "e", "and", "hw", "new"]);
  /* ranking tolerante: palavras raras (ex.: "Haas") pesam mais, palavras que não existem na wiki (ex.: "MoneyGram") são ignoradas */
  function rankNames(q){
    const nq = norm(q), cq = compact(q);
    const yrs = (nq.match(/\b(19|20)\d{2}\b/g) || []).map(y => y.slice(2));
    let qw = [...new Set(nq.split(" ").filter(w => w && !NAME_NOISE.has(w) && !/^(19|20)\d{2}$/.test(w)))];
    if (!qw.length) qw = nq.split(" ").filter(Boolean);
    if (!qw.length) return [];
    const kind = (x, words, w) => words.includes(w) ? 1 : words.some(v => v.startsWith(w)) ? .8 : x.n.includes(w) ? .5 : (w.length >= 3 && x.c.includes(w)) ? .3 : 0;
    const df = qw.map(() => 0), hits = [];
    for (const x of names) {
      const words = x.n.split(" ");
      const k = qw.map(w => kind(x, words, w));
      let any = false; k.forEach((v, i) => { if (v) { df[i]++; any = true; } });
      const whole = cq.length >= 3 && x.c.includes(cq);
      if (any || whole) hits.push({ x, words, k, whole });
    }
    const N = names.length || 1;
    const wt = df.map((d, i) => d ? Math.log((N + 1) / (d + 1)) * (/^\d+$/.test(qw[i]) && qw.length > 1 ? .55 : 1) : 0);
    const total = wt.reduce((a, b) => a + b, 0) || 1, maxW = Math.max(...wt);
    const out = [];
    for (const { x, words, k, whole } of hits) {
      let s = 0, key = false;
      k.forEach((v, i) => { s += v * wt[i]; if (v >= .8 && wt[i] >= maxW * .6) key = true; });
      if (!key && !whole && !k.every((v, i) => v || !wt[i])) continue;
      s = s / total * 100 + (whole ? 20 : 0);
      if (yrs.some(y => words.includes(y))) s += 4;
      if (x.n.startsWith(nq)) s += 25;
      if (x.n === nq) s += 40;
      s -= words.length * 0.8 + (/\(/.test(x.t) ? 6 : 0);
      out.push({ t: x.t, s });
    }
    return out.sort((a, b) => b.s - a.s || a.t.length - b.t.length).slice(0, 7).map(x => x.t);
  }
  async function onlineNames(q){
    const j = await wiki("&generator=prefixsearch&gpslimit=8&prop=pageimages&piprop=thumbnail&pithumbsize=120&gpssearch=" + encodeURIComponent(q));
    const got = Object.values((j.query && j.query.pages) || {}).sort((a, b) => a.index - b.index)
      .filter(p => !SKIP_NAME.test(p.title)).map(p => { if (p.thumbnail) thumbs[p.title] = p.thumbnail.source; return p.title; }).slice(0, 7);
    if (got.length >= 3) return got;
    const clean = norm(q).split(" ").filter(w => w && !NAME_NOISE.has(w) && !/^(19|20)\d{2}$/.test(w)).join(" ") || q;
    const k = await wiki("&generator=search&gsrnamespace=0&gsrlimit=15&prop=templates&tltemplates=Template:Casting&tllimit=50&gsrsearch=" + encodeURIComponent(clean));
    const more = Object.values((k.query && k.query.pages) || {}).sort((a, b) => a.index - b.index)
      .filter(p => p.templates && p.templates.length && !got.includes(p.title)).map(p => p.title);
    return got.concat(more).slice(0, 7);
  }
  const thumbs = {};
  async function fillThumbs(list){
    const need = list.filter(t => !(t in thumbs)); if (!need.length) return;
    try {
      const j = await wiki("&prop=pageimages&piprop=thumbnail&pithumbsize=120&redirects=1&titles=" + encodeURIComponent(need.join("|")));
      const pages = Object.values((j.query && j.query.pages) || {});
      need.forEach(t => { const p = pages.find(p => p.title === t); thumbs[t] = p && p.thumbnail ? p.thumbnail.source : ""; });
    } catch (e) { need.forEach(t => { thumbs[t] = ""; }); }
  }
  const hl = (t, q) => { let h = esc(t); norm(q).split(" ").filter(w => w.length > 1).forEach(w => { h = h.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "i"), "<mark>$1</mark>"); }); return h; };
  let nameIdx = -1, nameReq = 0, nameT;
  function hideNames(){ $("nameSugg").hidden = true; $("fName").setAttribute("aria-expanded", "false"); nameIdx = -1; }
  function paintNames(list, q){
    const box = $("nameSugg");
    if (!list.length || document.activeElement !== $("fName")) { hideNames(); return; }
    box.innerHTML = `<div class="nHead">${esc(t("nameSuggHead"))}</div>` + list.map(ti => `<button type="button" class="suggItem" role="option" data-v="${esc(ti)}">
      <span class="nth">${thumbs[ti] ? `<img src="${esc(thumbs[ti])}" alt="">` : ""}</span><span class="ntx">${hl(ti, q)}</span></button>`).join("");
    box.hidden = false; $("fName").setAttribute("aria-expanded", "true"); nameIdx = -1;
  }
  async function suggestNames(){
    const q = $("fName").value.trim(); const my = ++nameReq;
    if (!canEdit || q.length < 2) { hideNames(); return; }
    let list = [];
    try { list = names ? rankNames(q) : await onlineNames(q); } catch (e) {}
    if (my !== nameReq) return;
    paintNames(list, q);
    await fillThumbs(list);
    if (my === nameReq && !$("nameSugg").hidden) paintNames(list, q);
  }
  function pickName(title){
    const num = ($("fName").value.match(/#\s*(\d+)/) || [])[1];
    $("fName").value = title.toLocaleUpperCase("en-US"); hideNames(); checkDup();
    openCat(); showVersions(title, num ? "#" + num : "");
  }
  $("fName").addEventListener("input", () => { clearTimeout(nameT); nameT = setTimeout(suggestNames, names ? 90 : 280); });
  $("fName").addEventListener("input", () => {
    const el = $("fName"), up = el.value.toLocaleUpperCase("en-US");
    if (up !== el.value) { const a = el.selectionStart, b = el.selectionEnd; el.value = up; try { el.setSelectionRange(a, b); } catch (e) {} }
  }, true);
  $("fName").addEventListener("focus", () => { loadNames(); if ($("fName").value.trim().length >= 2) suggestNames(); });
  $("fName").addEventListener("blur", () => setTimeout(hideNames, 150));
  $("fName").addEventListener("keydown", e => {
    const items = [...$("nameSugg").querySelectorAll(".suggItem")];
    if ($("nameSugg").hidden || !items.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); nameIdx = (nameIdx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items.forEach((b, i) => b.classList.toggle("on", i === nameIdx));
    } else if (e.key === "Enter" && nameIdx >= 0) { e.preventDefault(); pickName(items[nameIdx].dataset.v); }
    else if (e.key === "Escape") { e.stopPropagation(); hideNames(); }
  });
  $("nameSugg").addEventListener("pointerdown", e => e.preventDefault());
  $("nameSugg").addEventListener("click", e => { const b = e.target.closest(".suggItem"); if (b) pickName(b.dataset.v); });

  /* sugestão automática: ao digitar o modelo num carrinho sem foto, mostra as fotos encontradas */
  let catHintFor = "", catHintT;
  async function catHint(){
    const q = $("fName").value.trim();
    const hasPhoto = pendingPhoto || pendingCat || (editing && (editing.photoId || editing.photoUrl));
    if (!canEdit || hasPhoto || q.length < 4) { $("catHint").hidden = true; return; }
    if (q === catHintFor) return; catHintFor = q;
    try {
      const list = (await searchModels(q)).filter(m => m.img).slice(0, 4);
      if (q !== $("fName").value.trim() || pendingPhoto || pendingCat) return;
      if (!list.length) { $("catHint").hidden = true; return; }
      $("catHint").innerHTML = `<div class="chHead">${esc(t("catFound"))}<button type="button" data-all="1">${esc(t("catAll"))}</button></div><div class="chRow">` +
        list.map(m => `<button type="button" class="catItem" data-model="${esc(m.title)}" title="${esc(m.title)}"><span class="ci"><img src="${esc(m.img)}" alt="" loading="lazy"></span></button>`).join("") + "</div>";
      $("catHint").hidden = false;
    } catch (e) { $("catHint").hidden = true; }
  }

  $("catHint").addEventListener("click", e => {
    if (e.target.closest("[data-all]")) { openCat(); return; }
    const b = e.target.closest(".catItem"); if (!b) return;
    openCat(); showVersions(b.dataset.model, codeQuery($("fName").value));
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("catSheet").hidden) { e.stopImmediatePropagation(); closeCat(); } }, true);

  async function shrink(file, max=1000){
    const url = URL.createObjectURL(file);
    try{
      const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
      const s = Math.min(1, max/Math.max(img.width,img.height));
      const cv = document.createElement("canvas"); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      return cv.toDataURL("image/jpeg",.82);
    } finally { URL.revokeObjectURL(url); }
  }
  async function onPhoto(e){
    const f = e.target.files[0]; e.target.value=""; if(!f) return;
    try{ pendingPhoto = await shrink(f); pendingCat = ""; showPhoto(pendingPhoto); msg(""); }
    catch(err){ msg("badImg"); }
  }
  $("photoInput").addEventListener("change", onPhoto);
  $("camInput").addEventListener("change", onPhoto);

  const cacheKey = () => "garagem164.cache." + viewing;
  function saveCache(){ if (!viewing) return; try{ localStorage.setItem(cacheKey(), JSON.stringify(cars)); }catch(e){} }
  function readCache(){ try{ const c = JSON.parse(localStorage.getItem(cacheKey()) || "null"); return Array.isArray(c) ? c : null; }catch(e){ return null; } }

  $("del").addEventListener("click", async () => {
    if(!editing || !canEdit) return;
    if(!delArmed){ delArmed=true; $("del").textContent=t("confirm"); $("del").classList.add("armed"); return; }
    const c = editing;
    $("del").disabled = true; busy++; setMode();
    try{
      await run("deleteCar", session.token, c.id);
      cars = cars.filter(x=>x.id!==c.id); saveCache(); render();
      closeAll(); toast("deleted");
    }catch(err){
      if (isAuthError(err)) lostPin(); else msg(errCode(err)==="FORBIDDEN" ? "forbidden" : "delFail");
    }finally{ $("del").disabled = false; busy--; setMode(); }
  });

  $("form").addEventListener("submit", async e => {
    e.preventDefault(); if(!canEdit) return;
    const name=$("fName").value.trim().toLocaleUpperCase("en-US"); if(!name){ msg("needName"); $("fName").focus(); return; }
    const data = {
      id: editing?.id || "", name, series:$("fSeries").value.trim(), num:$("fNum").value.trim(), year:+$("fYear").value||"",
      code:$("fCode").value.trim().toUpperCase(), type:$("fType").value, cond:$("fCond").value,
      color:$("fColor").value, qty:Math.max(1,+$("fQty").value||1), paid:$("fPaid").value===""?"":+$("fPaid").value,
      notes:$("fNotes").value.trim(), createdAt: editing?.createdAt || "", photoUrl: pendingPhoto ? "" : pendingCat
    };
    const was = !!editing, photo = pendingPhoto;
    $("save").disabled=true; $("save").textContent=t("saving"); busy++; setMode();
    try{
      const saved = await run("saveCar", session.token, data, photo ? photo.split(",")[1] : "");
      if (photo && saved.photoId) localPreview[saved.photoId] = photo;
      const i = cars.findIndex(x=>x.id===saved.id);
      if (i>=0) cars[i] = saved; else cars.push(saved);
      saveCache(); closeAll(); render();
      if (was) toast("savedEdit");
      else await warp(t("addedWarp").replace("{name}", saved.name || t("noName")), async () => {}, "added");
    }catch(err){
      if (isAuthError(err)) lostPin(); else msg(errCode(err)==="FORBIDDEN" ? "forbidden" : "saveFail");
    }finally{ $("save").disabled=false; $("save").textContent=t("save"); busy--; setMode(); }
  });

  /* carregar */
  async function load(){
    if (!session) { splashReady(); showAuth(); return; }
    const who = viewing;
    try{
      const list = await run("listCars", session.token, who);
      if (who !== viewing) return;
      cars = Array.isArray(list) ? list : [];
      mode = "ready"; loaded = true; saveCache();
    }catch(err){
      if (isAuthError(err)) { splashReady(); lostPin(); return; }
      mode = "off";
      if (!loaded) { loaded = true; }
    }
    setMode(); render(!seen); splashReady();
    if (mode === "ready" && isMine()) { if (!community) readCommunity(); setTimeout(prefetchCommunity, 800); }
  }
  if (session) { const c = readCache(); if (c) { cars = c; loaded = true; } }

  /* abertura */
  const t0 = Date.now();
  let splashDone = false;
  function splashReady(){
    if (splashDone) return; splashDone = true;
    const sp = $("splash"); if (!sp) return;
    setTimeout(() => {
      sp.classList.add("done");
      setTimeout(() => sp.classList.add("out"), 380);
      setTimeout(() => sp.remove(), 900);
    }, Math.max(0, 1700 - (Date.now() - t0)));
  }
  setTimeout(splashReady, 12000);

  /* atualização automática: se o GitHub tiver uma versão mais nova do que a aberta, recarrega uma vez */
  /* versão do app: mostrada no rodapé e na cartela do Sobre */
  const APP_VERSION = "1.9.5"
  const DEFAULT_PAID = "1.25";
  document.querySelectorAll(".appVersion").forEach(el => el.textContent = APP_VERSION);
  const BUILD = "202609270115";
  (async () => {
    try {
      const r = await fetch(location.pathname + "?build=" + Date.now(), { cache: "no-store" });
      const m = (await r.text()).match(/const BUILD = "(\d+)"/);
      if (m && m[1] !== BUILD) {
        const key = "garagem164.reloadedFor";
        if (sessionStorage.getItem(key) !== m[1]) { sessionStorage.setItem(key, m[1]); location.reload(); }
      }
    } catch (e) {}
  })();

  applyLang();
  $("fPaid").addEventListener("input", paintPaidHint);
  load();
  refreshFx();
  let lastSync = Date.now();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState==="visible" && session && Date.now()-lastSync > 15000 && !busy) { lastSync = Date.now(); load(); }
  });
})();
</script>
