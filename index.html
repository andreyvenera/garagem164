<style>
:root{
  color-scheme:dark;
  --bg:#111418;--surface:#1A1F26;--surface2:#232A33;--line:#2E3642;
  --text:#E9EDF2;--muted:#8D98A8;--accent:#4C8DFF;--accent-ink:#06142E;
  --gold:#E8B64A;--gold-ink:#1A1406;--danger:#FF6B5B;--ok:#4FC98A;
  --shadow:0 18px 40px rgba(0,0,0,.45);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#EEF1F5;--surface:#FFFFFF;--surface2:#E4E9F0;--line:#D3DAE4;
    --text:#151A21;--muted:#5B6676;--accent:#1F63E0;--accent-ink:#FFFFFF;
    --gold:#B7861E;--gold-ink:#FFFFFF;--danger:#D23A2A;--ok:#1E8E57;
    --shadow:0 18px 40px rgba(20,30,50,.18);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EEF1F5;--surface:#FFFFFF;--surface2:#E4E9F0;--line:#D3DAE4;
  --text:#151A21;--muted:#5B6676;--accent:#1F63E0;--accent-ink:#FFFFFF;
  --gold:#B7861E;--gold-ink:#FFFFFF;--danger:#D23A2A;--ok:#1E8E57;
  --shadow:0 18px 40px rgba(20,30,50,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:env(safe-area-inset-top,0px) 120px;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
.lockBtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.pinBox{display:grid;gap:10px}
.pinBox input{font-family:var(--mono);font-size:22px;letter-spacing:.3em;text-align:center;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.about p.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.skel{border-radius:12px;background:var(--surface);border:1px solid var(--line);aspect-ratio:3/4;max-width:100%}
@media (prefers-reduced-motion:no-preference){.skel{animation:shim 1.2s ease-in-out infinite alternate}@keyframes shim{from{opacity:.55}to{opacity:1}}}
.wrap{max-width:980px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.brand{display:grid;gap:2px;min-width:0}
.brand h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:36px;line-height:.95;margin:0;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.acc{color:var(--accent)}
.mode{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tag{margin:0;font-size:11px;color:var(--muted);line-height:1.3}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:4px 0;cursor:pointer}
.prefs{display:flex;align-items:center;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;font-family:var(--mono);font-size:11.5px;padding:4px 10px;cursor:pointer;min-height:28px}
.pill:hover{border-color:var(--muted)}
.pic img.ph{width:72%;height:auto;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.photo img.ph{width:40%;height:auto;max-width:40%;object-fit:contain;margin-bottom:28px}
.about .eyebrow{margin:0 0 2px;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.about h2{font-size:40px;line-height:.95}
.about .lead{margin:0 0 16px;font-size:16px;max-width:60ch}
.facts{display:grid;margin:0 0 16px;border-top:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:13px}
.facts dd{margin:0;font-weight:700}
.facts .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.legal{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
.backup{display:grid;gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px;margin:0 0 14px}
.backup .sub{margin:0}
.backupRes{margin:0;font-size:14px}
.backupRes a{color:var(--accent);font-weight:700}
.car{position:relative}
.seriesWrap{position:relative;display:grid}
.sugg{display:grid;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.suggItem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 12px;text-align:left;cursor:pointer;font-size:15px}
.suggItem:last-child{border-bottom:0}
.suggItem:hover,.suggItem.on{background:var(--surface2)}
.suggItem small{flex:none;font-family:var(--mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.dup{border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--surface));border-radius:12px;padding:10px;display:grid;gap:8px}
.dup .dupHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.04em;text-transform:uppercase}
.dup .dupHead small{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
.dupItem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--bg);border-radius:9px;padding:6px;text-align:left;cursor:pointer}
.dupItem:hover{outline:1px solid var(--line)}
.dupItem .th{flex:none;width:56px;height:42px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;overflow:hidden}
.dupItem .th img{width:100%;height:100%;object-fit:cover}
.dupItem .th img.ph{width:82%;height:auto;object-fit:contain}
.dupItem b{display:block;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.dupItem span{font-size:12px;color:var(--muted)}
.dupItem .why{margin-left:auto;flex:none;font-family:var(--mono);font-size:10.5px;color:var(--gold)}
.more{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.more summary{cursor:pointer;list-style:none;padding:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:16px;transition:transform .2s}
.more[open] summary::after{transform:rotate(45deg)}
.moreBody{display:grid;gap:10px;padding:0 12px 12px}
.moreBody .field input,.moreBody .field select,.moreBody .field textarea{background:var(--surface)}
@media (prefers-reduced-motion:no-preference){
  .grid.enter .car{animation:rise .34s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 30ms)}
  .car.pop{animation:pop .6s cubic-bezier(.2,.9,.25,1.15) both}
  .car.pop::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 2px var(--accent);animation:ring 1.4s ease-out forwards}
  .bump{display:inline-block;animation:bump .45s ease-out}
  .dup:not([hidden]){animation:rise .22s ease-out}
  .more[open] .moreBody{animation:rise .22s ease-out}
  .chip{transition:background-color .15s,color .15s,transform .1s}
  .chip:active,.fab:active,.btn:active{transform:scale(.96)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.82) translateY(8px)}60%{opacity:1;transform:scale(1.03)}100%{transform:none}}
  @keyframes ring{0%,40%{opacity:1}100%{opacity:0}}
  @keyframes bump{0%{transform:none}35%{transform:translateY(-3px) scale(1.12);color:var(--accent)}100%{transform:none}}
}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
button.stats{width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:left;grid-template-columns:1fr 1fr;row-gap:6px;color:inherit}
button.stats .stat{display:block}
.garageTile{display:flex;align-items:center;gap:12px;width:100%;margin-top:8px;padding:10px 14px 10px 10px;border-radius:12px;cursor:pointer;text-align:left;color:var(--text);
  border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface) 70%)}
.garageTile:hover{border-color:var(--accent)}
.gtIcon{flex:none;width:46px;height:46px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.gtText{display:grid;min-width:0}
.gtText b{font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.gtText small{font-size:12.5px;color:var(--muted);margin-top:3px}
.gtGo{margin-left:auto;flex:none;font-size:26px;line-height:1;color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:no-preference){.garageTile{transition:transform .12s ease,border-color .15s}.garageTile:active{transform:scale(.98)}}
button.stats:hover .stat{border-color:var(--muted)}
.garage h2{margin:0}
.gTop{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:14px}
.gTitle{min-width:0}
.mascot{position:relative;flex:none;width:clamp(72px,22vw,96px);margin-top:-6px}
.mascot img{display:block;width:100%;height:auto;transform:rotate(7deg);filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.bubble{position:absolute;top:2px;right:calc(100% - 4px);white-space:nowrap;background:var(--text);color:var(--bg);font-weight:700;font-size:12.5px;line-height:1;padding:7px 10px;border-radius:12px 12px 2px 12px}
.bubble::after{content:"";position:absolute;right:-5px;bottom:0;border:6px solid transparent;border-left-color:var(--text);border-bottom-color:var(--text);border-width:0 0 8px 8px}
@media (prefers-reduced-motion:no-preference){
  .mascot.play img{animation:mascotIn .7s cubic-bezier(.2,1.5,.4,1) both, mascotWobble 2.6s ease-in-out .8s infinite}
  .mascot.play .bubble{animation:bubbleIn .35s cubic-bezier(.2,1.4,.4,1) .55s both}
  @keyframes mascotIn{0%{opacity:0;transform:translateY(40px) rotate(-10deg) scale(.6)}100%{opacity:1;transform:rotate(7deg)}}
  @keyframes mascotWobble{0%,100%{transform:rotate(7deg)}50%{transform:rotate(2deg) translateY(-2px)}}
  @keyframes bubbleIn{from{opacity:0;transform:scale(.4) translateX(10px)}to{opacity:1;transform:none}}
}
.gGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.gStat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.gStat b{display:block;font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gStat small{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.gHead{margin:0 0 8px;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.gHi{display:grid;gap:8px;margin-bottom:18px}
.gItem{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px;text-align:left;cursor:pointer}
.gItem:hover{border-color:var(--muted)}
.gItem .th{flex:none;width:64px;height:48px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;overflow:hidden}
.gItem .th img{width:100%;height:100%;object-fit:cover}
.gItem .th img.ph{width:84%;height:auto;object-fit:contain}
.gTxt{display:grid;min-width:0}
.gTxt small{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.gTxt b{font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.gTxt span{font-size:12px;color:var(--muted)}
.gVal{margin-left:auto;flex:none;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.gEmpty{margin:0;color:var(--muted);font-size:14px}
.bars{display:grid;gap:8px;margin-bottom:18px}
.barRow{display:grid;grid-template-columns:minmax(0,34%) 1fr auto;align-items:center;gap:10px}
.barLabel{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barTrack{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.barFill{display:block;height:100%;border-radius:5px;background:var(--accent)}
.barN{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
@media (prefers-reduced-motion:no-preference){.garage:not([hidden]) .barFill{animation:grow .6s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{width:0}}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stat.gold b{color:var(--gold)}

.tools{display:flex;gap:8px;margin-top:12px}
.search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sort{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 8px;max-width:130px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

.examples{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;font-size:13px;color:var(--muted)}
.examples button{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-top:14px}
.car{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.car:hover{border-color:var(--muted)}
.pic{position:relative;aspect-ratio:4/3;max-width:100%;background:radial-gradient(120% 90% at 50% 110%,var(--surface2),var(--surface));display:grid;place-items:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pic svg{width:78%;height:auto}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.b{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.b.th{border-color:var(--gold);color:var(--gold)}
.b.sth{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.b.want{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.b.ex{border-style:dashed;color:var(--muted)}
.qty{position:absolute;right:8px;bottom:8px;font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.meta{padding:10px 12px 12px;display:grid;gap:2px}
.meta h3{margin:0;font-size:15px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.meta p{margin:0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.meta .code{font-family:var(--mono);font-size:11px;color:var(--muted)}

.empty{text-align:center;color:var(--muted);padding:48px 12px}
.empty strong{display:block;color:var(--text);font-family:var(--display);font-style:italic;font-size:26px;text-transform:uppercase}

.fab{flex:none;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:13px 18px;cursor:pointer;font-size:15px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);max-width:640px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;text-transform:uppercase;margin:0 0 12px}
.photo{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;margin-bottom:12px;border:1px dashed var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}
.photoBtns{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.photo label{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text)}
.photo label.cam{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.photo .hint{position:absolute;left:10px;bottom:12px;font-size:12px;color:var(--muted)}
form{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.field input[type=color]{padding:4px;height:42px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:10px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);font-weight:700}
.actions{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;border-radius:10px;padding:12px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;color:var(--danger);min-height:1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;font-weight:500}
@media (min-width:700px){.stats{max-width:560px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.bar .brand{flex:1;min-width:0}
.bar .brand h1{font-size:clamp(22px,6.8vw,36px);overflow:hidden;text-overflow:clip}
@media (max-width:420px){.bar .fab{padding:12px 15px;font-size:14px}}
.bar .tag{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>

<style>
  .splash{position:fixed;inset:0;z-index:100;background:#111418;color:#E9EDF2;display:grid;place-items:center;overflow:hidden;
    font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .45s ease,visibility .45s ease}
  .splash.out{opacity:0;visibility:hidden}
  .splash .sp-in{position:relative;display:grid;justify-items:center;gap:18px;padding:24px;text-align:center}
  .splash .sp-eyebrow{margin:0;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#8D98A8}
  .splash .sp-title{margin:0;font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-style:italic;font-weight:800;
    text-transform:uppercase;line-height:.86;font-size:clamp(52px,15vw,132px);letter-spacing:.01em}
  .splash .sp-title span{display:block}
  .splash .sp-title .sp-scale{color:#4C8DFF}
  .splash .sp-track{position:relative;width:min(240px,62vw);height:10px;border-radius:3px;overflow:hidden;background:#232A33}
  .splash .sp-fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(.08);
    background:repeating-conic-gradient(#E9EDF2 0 25%,#111418 0 50%) 0 0/10px 10px}
  .splash .sp-tag{margin:0;font-size:12.5px;color:#8D98A8}
  .splash .sp-lines{position:absolute;inset:-40% -60%;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(76,141,255,.18) 46px 47px,transparent 47px 120px);
    mask-image:radial-gradient(closest-side,#000,transparent);-webkit-mask-image:radial-gradient(closest-side,#000,transparent)}
  @media (prefers-reduced-motion:no-preference){
    .splash .sp-lines{animation:sp-rush .5s linear infinite}
    .splash .sp-title span{animation:sp-in .7s cubic-bezier(.2,.8,.2,1) both}
    .splash .sp-title .sp-scale{animation-delay:.14s}
    .splash .sp-eyebrow,.splash .sp-track,.splash .sp-tag{animation:sp-fade .5s ease .35s both}
    .splash .sp-fill{animation:sp-load 2.6s cubic-bezier(.3,.6,.2,1) .4s forwards}
    .splash.done .sp-fill{animation:none;transform:scaleX(1);transition:transform .35s ease}
    .splash.out .sp-in{transform:scale(1.06) translateX(14px);transition:transform .45s ease}
    @keyframes sp-rush{to{transform:translateX(-120px)}}
    @keyframes sp-in{from{opacity:0;transform:translateX(-60px) skewX(-12deg)}to{opacity:1;transform:none}}
    @keyframes sp-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes sp-load{to{transform:scaleX(.86)}}
  }
  .splash.done .sp-fill{transform:scaleX(1)}
</style>

    <div class="sp-track" aria-hidden="true"><div class="sp-fill"></div></div>

</div>

  const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
  let lang = "pt"; /* sempre abre em português */
  const t = k => (T[lang] && T[lang][k]) || T.pt[k] || k;
  const COND = { "Na cartela":"cCarded", "Solto":"cLoose", "Cartela danificada":"cDamaged" };
  const FILTERS = [["all","fAll"],["Mainline",null],["Premium",null],["RLC",null],["loose","fLoose"]];

  /* servidor: o Apps Script da planilha responde como uma API */

  const hasServer = true;
  async function run(fn, ...args){
    const r = fn === "listCars"
      ? await fetch(API + "?action=list&t=" + Date.now(), { cache: "no-store" })
      : await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: fn, args }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "erro");
    return j.data;
  }
  const isPinError = e => /PIN/.test(String(e && (e.message || e)));

  let cars = [], filter = "all", mode = "loading", pin = store.get("garagem164.pin") || "", canEdit = false;
  let editing = null, pendingPhoto = null, delArmed = false, busy = 0;
  const localPreview = {}; // fotos recém enviadas, mostradas até o Drive gerar a miniatura

  const sortSaved = store.get("garagem164.sort"); if (sortSaved) $("sort").value = sortSaved;

  /* tema */
  const effTheme = () => { const a = root.getAttribute("data-theme"); if (a==="dark"||a==="light") return a; return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; };
  root.setAttribute("data-theme", "dark"); /* sempre abre no escuro */
  function paintThemeBtn(){ const d = effTheme()==="dark"; $("themeBtn").textContent = d ? "☀" : "☾"; $("themeBtn").setAttribute("aria-label", d ? t("toLight") : t("toDark")); $("themeBtn").title = $("themeBtn").getAttribute("aria-label"); }
  $("themeBtn").addEventListener("click", () => { const n = effTheme()==="dark" ? "light" : "dark"; root.setAttribute("data-theme", n); paintThemeBtn(); });
  try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", paintThemeBtn); } catch(e) {}

  /* idioma */
  function applyLang(){
    root.lang = lang==="en" ? "en" : "pt-BR";
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));

    $("langBtn").textContent = lang==="pt" ? "EN" : "PT";
    $("langBtn").setAttribute("aria-label", t("toLang")); $("langBtn").title = t("toLang");
    $("chips").innerHTML = FILTERS.map(([v,k]) => `<button class="chip" type="button" data-f="${v}" aria-pressed="${v===filter}">${k?t(k):v}</button>`).join("");
    paintThemeBtn(); paintLock(); setMode(); render();
    if (!$("sheet").hidden) refreshSheetTexts();
  }
  $("langBtn").addEventListener("click", () => { lang = lang==="pt" ? "en" : "pt"; applyLang(); });

  const money = n => new Intl.NumberFormat(lang==="en"?"en-US":"pt-BR",{style:"currency",currency:"USD"}).format(n||0);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const PH = "ph.webp";
  const carSvg = () => `<img class="ph" src="${PH}" alt="">`;
  const photoUrl = c => c.photoId ? (localPreview[c.photoId] || "https://drive.google.com/thumbnail?id=" + encodeURIComponent(c.photoId) + "&sz=w1000") : "";

  function toast(k){ const el=$("toast"); el.textContent=t(k); el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200); }
  const msg = k => { $("msg").textContent = k ? t(k) : ""; };

  $("chips").addEventListener("click", e => { const b=e.target.closest(".chip"); if(!b) return; filter=b.dataset.f; document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b)); render(true); });
  let qT; $("q").addEventListener("input", () => { clearTimeout(qT); qT = setTimeout(()=>render(true), 140); });
  $("sort").addEventListener("change", () => { store.set("garagem164.sort",$("sort").value); render(true); });

  function match(c){
    if (filter==="Mainline" && c.type!=="Mainline") return false;

  const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/['’`´]/g,"").replace(/[^a-z0-9]+/g," ").trim();
  const words = s => norm(s).split(" ").filter(w => w.length>1 || /\d/.test(w));
  function similar(name, code){
    const n = norm(name), nw = words(name), cd = norm(code).replace(/ /g,"");
    if (n.length < 3 && cd.length < 4) return [];
    const out = [];
    for (const c of cars) {
      if (editing && c.id===editing.id) continue;
      let why = null, score = 0;
      const cn = norm(c.name), cc = norm(c.code).replace(/ /g,"");
      if (cd.length>=4 && cc && cc===cd) { why="dupCode"; score=3; }
      else if (n.length>=3 && cn===n) { why="dupName"; score=2; }
      else if (n.length>=3 && cn) {
        const cw = words(c.name);
        const hit = nw.filter(w => cw.some(x => x===w || (w.length>=3 && x.startsWith(w)) || (x.length>=3 && w.startsWith(x)))).length;
        const ratio = hit / Math.max(1, Math.min(nw.length, cw.length));
        if (cn.includes(n) || n.includes(cn) || ratio>=0.6) { why="dupLike"; score=1+ratio/2; }
      }
      if (why) out.push({c, why, score});
    }
    return out.sort((a,b)=>b.score-a.score).slice(0,3);
  }

  function seriesOptions(q){
    const nq = norm(q);
    const counts = {};
    cars.forEach(c => { const k = (c.series||"").trim(); if (k) counts[k] = (counts[k]||0) + 1; });
    const mine = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
    const seen = new Set(), out = [];
    const add = (name, n) => { const k = norm(name); if (!k || seen.has(k)) return; seen.add(k); out.push({ name, n }); };
    const hit = name => !nq || norm(name).includes(nq);
    const starts = name => norm(name).startsWith(nq) || norm(name).replace(/^hw /,"").startsWith(nq);
    mine.filter(hit).forEach(n => add(n, counts[n]));
    SERIES.filter(n => nq && starts(n)).forEach(n => add(n));
    SERIES.filter(hit).forEach(n => add(n));
    return out.filter(o => norm(o.name) !== nq || o.n).slice(0, 7);

  async function shrink(file, max=1000){
    const url = URL.createObjectURL(file);
    try{
      const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
      const s = Math.min(1, max/Math.max(img.width,img.height));
      const cv = document.createElement("canvas"); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      return cv.toDataURL("image/jpeg",.82);
    } finally { URL.revokeObjectURL(url); }
  }

  function saveCache(){ try{ localStorage.setItem("garagem164.cache", JSON.stringify(cars)); }catch(e){} }

  $("del").addEventListener("click", async () => {
    if(!editing || !canEdit) return;
    if(!delArmed){ delArmed=true; $("del").textContent=t("confirm"); $("del").classList.add("armed"); return; }
    const c = editing;
    $("del").disabled = true; busy++; setMode();
    try{
      await run("deleteCar", pin, c.id);
      cars = cars.filter(x=>x.id!==c.id); saveCache(); render();
      closeAll(); toast("deleted");
    }catch(err){
      if (isPinError(err)) { lostPin(); msg("pinLost"); } else msg("delFail");
    }finally{ $("del").disabled = false; busy--; setMode(); }
  });

  $("form").addEventListener("submit", async e => {
    e.preventDefault(); if(!canEdit) return;
    const name=$("fName").value.trim(); if(!name){ msg("needName"); $("fName").focus(); return; }
    const data = {
      id: editing?.id || "", name, series:$("fSeries").value.trim(), num:$("fNum").value.trim(), year:+$("fYear").value||"",
      code:$("fCode").value.trim().toUpperCase(), type:$("fType").value, cond:$("fCond").value,
      color:$("fColor").value, qty:Math.max(1,+$("fQty").value||1), paid:$("fPaid").value===""?"":+$("fPaid").value,
      notes:$("fNotes").value.trim(), createdAt: editing?.createdAt || ""
    };
    const was = !!editing, photo = pendingPhoto;
    $("save").disabled=true; $("save").textContent=t("saving"); busy++; setMode();
    try{
      const saved = await run("saveCar", pin, data, photo ? photo.split(",")[1] : "");
      if (photo && saved.photoId) localPreview[saved.photoId] = photo;
      const i = cars.findIndex(x=>x.id===saved.id);
      if (i>=0) cars[i] = saved; else cars.push(saved);
      saveCache(); closeAll(); render(); toast(was?"savedEdit":"added");
    }catch(err){
      if (isPinError(err)) { lostPin(); msg("pinLost"); } else msg("saveFail");
    }finally{ $("save").disabled=false; $("save").textContent=t("save"); busy--; setMode(); }
  });

  /* carregar */
  async function load(){
    try{
      const list = await run("listCars");
      cars = Array.isArray(list) ? list : [];
      mode = "ready"; loaded = true; saveCache();
    }catch(err){
      mode = "off";
      if (!loaded) { loaded = true; }
    }
    setMode(); render(!seen); splashReady();
  }
  try{ const c = JSON.parse(localStorage.getItem("garagem164.cache")||"null"); if (Array.isArray(c) && (!c.length || "photoId" in c[0])) { cars = c; loaded = true; } }catch(e){}

  /* abertura */
  const t0 = Date.now();
  let splashDone = false;
  function splashReady(){
    if (splashDone) return; splashDone = true;
    const sp = $("splash"); if (!sp) return;
    setTimeout(() => {
      sp.classList.add("done");
      setTimeout(() => sp.classList.add("out"), 380);
      setTimeout(() => sp.remove(), 900);
    }, Math.max(0, 1700 - (Date.now() - t0)));
  }
  setTimeout(splashReady, 12000);

  applyLang();
  if (pin) run("checkPin", pin).then(ok => ok ? setEdit(true) : lostPin()).catch(()=>{});
  load();
  let lastSync = Date.now();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState==="visible" && Date.now()-lastSync > 15000 && !busy) { lastSync = Date.now(); load(); }
  });
})();
</script>
</body>
</html>
